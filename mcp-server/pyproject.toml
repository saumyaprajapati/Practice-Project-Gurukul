[project]
name = "gurukul-mcp"
version = "0.1.0"
description = "Gurukul MCP server (Streamable HTTP) for AI agents, signed in through Supabase OAuth"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2,<3",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
gurukul-mcp = "gurukul_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
